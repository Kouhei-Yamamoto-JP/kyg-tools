<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="画像を格子や縦横に配置して一覧画像を作成します。"><title>画像をつなげる | KYG Style Tools</title><link rel="stylesheet" href="/assets/image-suite/common.css"><script async src="https://www.googletagmanager.com/gtag/js?id=G-W0C7QYMWLX"></script><script src="/analytics.js"></script></head><body><main class="container"><header class="header"><p class="brand"><a href="/">← tools.kyg-style.com</a></p><h1>画像をつなげる</h1><p class="subtitle">写真や図を並べて、見やすい一覧画像にまとめます。</p></header><div data-tool-nav></div><section class="panel"><h2>画像を追加</h2><div class="dropzone" id="drop"><strong>画像をここへドロップ</strong><p>ファイル選択や貼り付けにも対応します。</p><button class="btn" id="choose">ファイルを選ぶ</button><input id="files" type="file" accept="image/*,.heic,.heif" multiple hidden></div><p class="privacy-note">画像はお使いの端末内で処理し、ファイル本体を外部へ送りません。</p><p class="hint">最大20枚、1枚20MB・1,600万画素・辺12,000px、合計100MB・6,400万画素まで。</p><div id="list"></div></section><section class="panel"><h2>配置と保存</h2><div class="field-row"><label>配置<select id="layout"><option value="grid">格子</option><option value="vertical">縦に積む</option><option value="horizontal">横に並べる</option></select></label><label>枠の大きさ<input id="size" type="number" min="32" max="2400" value="480"></label><label>列数<input id="cols" type="number" min="1" max="20" value="3"></label><label>間隔<input id="gap" type="number" min="0" max="200" value="16"></label><label>外側の余白<input id="margin" type="number" min="0" max="200" value="24"></label><label>収め方<select id="fit"><option value="contain">全体を収める</option><option value="cover">中央を切り抜く</option></select></label><label>背景色<input id="bg" type="color" value="#ffffff"></label><label><input id="transparent" type="checkbox"> PNG／WebPで透明背景にする</label><label>形式<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><label>保存名<input id="name" value="image-sheet"></label></div><label><input type="checkbox" id="names"> 枠にファイル名を表示</label><p><button class="btn primary" id="make">一覧画像を作る</button> <button class="btn danger" id="cancel" disabled>中止する</button> <button class="btn" id="save" disabled>画像を保存</button></p><p id="status" class="status-bar" aria-live="polite">画像を追加してください。</p><canvas id="canvas" style="max-width:100%;height:auto"></canvas></section><footer class="footer"><a href="/">ホームへ戻る</a> · 端末内で処理します。</footer></main><script src="/assets/image-suite/ui.js"></script><script src="app.js"></script></body></html>
