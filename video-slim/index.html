<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="動画をブラウザ内でMP4に変換し、画質や解像度を調整します。"
    />
    <title>動画を軽くする | KYG Style Tools</title>
    <link rel="stylesheet" href="/assets/image-suite/common.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-W0C7QYMWLX"
    ></script>
    <script src="/analytics.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <p class="brand"><a href="/">← tools.kyg-style.com</a></p>
        <h1>動画を軽くする</h1>
        <p class="subtitle">
          動画を端末内でMP4に変換し、画質と大きさを整えます。
        </p>
      </header>
      <div data-tool-nav></div>
      <section class="panel">
        <h2>動画を選ぶ</h2>
        <div class="dropzone" id="drop">
          <strong>動画をここへドロップ</strong>
          <p>再生できる動画を1本選択してください。</p>
          <button class="btn" id="choose">動画を選ぶ</button
          ><input id="file" type="file" accept="video/*" hidden />
        </div>
        <p class="privacy-note">
          動画本体は端末内だけで処理します。初回のみ処理エンジン（約25MB）を公開CDNから読み込みます。動画は送信しません。
        </p>
        <p class="hint">
          目安上限：100MB・15分・840万画素・辺4,096px。字幕・追加音声・撮影情報は出力に含めません。
        </p>
        <video
          id="preview"
          controls
          style="max-width: 100%; max-height: 320px"
        ></video>
        <div class="field-row">
          <label
            >圧縮の強さ<select id="quality">
              <option value="18">画質優先</option>
              <option value="23" selected>標準</option>
              <option value="28">容量優先</option>
            </select></label
          ><label
            >長辺の上限<select id="resolution">
              <option>1080</option>
              <option selected>720</option>
              <option>480</option>
            </select></label
          ><label
            ><input id="audio" type="checkbox" checked />
            音声を残す（先頭の音声）</label
          >
        </div>
        <p>
          <button class="btn primary" id="start" disabled>MP4を作成</button>
          <button class="btn danger" id="cancel" disabled>
            処理を中止する
          </button>
        </p>
        <progress id="progress" max="1" value="0"></progress>
        <p id="status" class="status-bar" aria-live="polite">
          動画を追加してください。
        </p>
        <div id="result"></div>
      </section>
      <footer class="footer">
        <a href="/">ホームへ戻る</a> · 選択した動画は端末内で処理します。 · FFmpeg.wasm / FFmpeg
      </footer>
    </main>
    <script src="/assets/image-suite/ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
