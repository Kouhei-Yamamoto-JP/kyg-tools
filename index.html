<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KYG Style のブラウザ向けツール集。X 表示名改行など。">
  <title>KYG Style Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="brand">tools.kyg-style.com</p>
      <h1>KYG Style Tools</h1>
      <p class="subtitle">ブラウザだけで使える小さなツール集です。今後ここにツールを追加していきます。</p>
    </header>

    <section class="tools" aria-label="ツール一覧">
      <a class="card" href="改行ツール/">
        <h2>X 表示名改行ツール</h2>
        <p>X（Twitter）の表示名に Unicode 改行（LSEP）を入れてコピーします。絵文字対応。</p>
      </a>
    </section>

    <footer class="footer">
      <p>新しいツールはフォルダを追加し、このページにカードを足すだけで公開できます。</p>
    </footer>
  </main>
</body>
</html>
