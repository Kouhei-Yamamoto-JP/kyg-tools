  <style>
    :root {

<body>
  <div class="app">
    <header class="topbar">
      <p class="brand"><a href="/">← tools.kyg-style.com</a></p>
      <h1>駐車場ナビ試し（現在地）</h1>
      <div class="controls">
        <button type="button" id="btn-locate" class="btn primary">現在地を表示</button>
        <label class="toggle" for="toggle-heading">
          <input type="checkbox" id="toggle-heading">
          向きを合わせる
        </label>
        <button type="button" id="btn-north" class="btn" disabled>北上に戻す</button>
        <label class="toggle" for="toggle-pitch">
          <input type="checkbox" id="toggle-pitch">
          立体
        </label>
        <div class="basemap-group" role="group" aria-label="ベースマップ">
          <button type="button" id="btn-base-vector" class="active" aria-pressed="true">標準</button>
          <button type="button" id="btn-base-photo" aria-pressed="false">航空写真</button>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">位置情報は端末内だけで使い、サーバには送りません。</p>
    </header>
    <div id="map" role="application" aria-label="地図"></div>
    <p class="hint-bar" id="hint-bar">屋外推奨・HTTPS必須。標準はベクトル地図（向き合わせ時も地名が正立）。向き合わせ時: 静止はコンパス、移動開始後はGPS進行方向を優先。ドラッグで追従解除→「現在地を表示」で復帰。コンパス／北上でノースアップ。航空写真は国土地理院写真＋正立ベクトル地名＋建物3D。iPhoneはコンパス許可後。</p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
(function () {
  'use strict';

  var TOKYO = [139.7671, 35.6812];
  var VECTOR_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
  var PITCH_ON = 60;

  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint-bar');
  var btnLocate = document.getElementById('btn-locate');
  var btnNorth = document.getElementById('btn-north');
  var toggleHeading = document.getElementById('toggle-heading');
  var togglePitch = document.getElementById('toggle-pitch');
  var btnBaseVector = document.getElementById('btn-base-vector');
  var btnBasePhoto = document.getElementById('btn-base-photo');

  var watchId = null;
  var orientHandler = null;
  var lastPos = null;
  var followHeading = false;
  var followLocation = true;
  var basemap = 'vector'; // 'vector' | 'photo'
  var vectorStyleFailed = false;
  var photoHybridFailed = false;
  var libertyStyleCache = null;
  var libertyStylePromise = null;
  var headingSource = null; // 'device' | 'geo' | null
  var lastHeadingDeg = null;
  var smoothedBearing = null;
  var lastBearingApplyAt = 0;
  var BEARING_THROTTLE_MS = 120;
  // iOS: MapLibre が CCW で食い違う場合は true にすると mapBearing = (360 - h) % 360
  var IOS_BEARING_INVERT = false;
  var applyingProgrammaticMove = false;

  // Heading-up: stationary → compass; moving → GPS course (hysteresis)
  var MOTION_ENTER_MPS = 1.2;
  var MOTION_EXIT_MPS = 0.6;
  var MIN_COURSE_DIST_M = 4;
  var MOTION_CONFIRM_N = 2;
  var POS_HISTORY_MAX = 8;
  var isMoving = false;
  var motionEnterStreak = 0;
  var motionExitStreak = 0;
  var lastCompassHeading = null;
  var lastGpsCourseDeg = null;
  var posHistory = []; // {lng, lat, t}

  var IS_IOS = (function () {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
    return false;
  })();

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function statusWithHeading(base, kind) {
    var msg = base;
    if (lastHeadingDeg != null && !Number.isNaN(lastHeadingDeg)) {
      msg += '・向き ' + Math.round(lastHeadingDeg) + '°';
    }
    setStatus(msg, kind);
  }

  function followStatusBase() {
    if (followLocation) return '現在地を追従中';
    return '地図操作中（現在地で復帰）';
  }

  function refreshLocationStatus(kind) {
    var msg = followStatusBase();
    if (lastPos) {
      msg += '・表示中';
    }
    if (followHeading && headingSource) {
      msg += headingSourceLabel();
    }
    statusWithHeading(msg, kind || (followLocation ? 'ok' : ''));
  }

  function headingSourceLabel() {
    if (!followHeading || !headingSource) return '';
    if (headingSource === 'device') return '・方位: コンパス';
    if (headingSource === 'geo') return '・方位: GPS進行方向';
    return '';
  }

  function shortestAngleDelta(from, to) {
    return ((to - from + 540) % 360) - 180;
  }

  function normalizeDeg(d) {
    return ((d % 360) + 360) % 360;
  }

  function toRad(d) {
    return (d * Math.PI) / 180;
  }

  function toDeg(r) {
    return (r * 180) / Math.PI;
  }

  function haversineMeters(lng1, lat1, lng2, lat2) {
    var R = 6371000;
    var φ1 = toRad(lat1);
    var φ2 = toRad(lat2);
    var Δφ = toRad(lat2 - lat1);
    var Δλ = toRad(lng2 - lng1);
    var a =
      Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
      Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingBetween(lng1, lat1, lng2, lat2) {
    var φ1 = toRad(lat1);
    var φ2 = toRad(lat2);
    var Δλ = toRad(lng2 - lng1);
    var y = Math.sin(Δλ) * Math.cos(φ2);
    var x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return normalizeDeg(toDeg(Math.atan2(y, x)));
  }

  function pushPosHistory(lng, lat, t) {
    posHistory.push({ lng: lng, lat: lat, t: t });
    if (posHistory.length > POS_HISTORY_MAX) posHistory.shift();
  }

  function courseFromHistory() {
    if (posHistory.length < 2) return null;
    var newest = posHistory[posHistory.length - 1];
    for (var i = posHistory.length - 2; i >= 0; i--) {
      var p = posHistory[i];
      var d = haversineMeters(p.lng, p.lat, newest.lng, newest.lat);
      if (d >= MIN_COURSE_DIST_M) {
        return bearingBetween(p.lng, p.lat, newest.lng, newest.lat);
      }
    }
    return null;
  }

  function estimateSpeedMps() {
    if (posHistory.length < 2) return null;
    var a = posHistory[posHistory.length - 2];
    var b = posHistory[posHistory.length - 1];
    var dt = (b.t - a.t) / 1000;
    if (!(dt > 0)) return null;
    return haversineMeters(a.lng, a.lat, b.lng, b.lat) / dt;
  }

  function updateMotionState(speedMps) {
    var spd = speedMps;
    if (spd == null || Number.isNaN(spd) || spd < 0) {
      spd = estimateSpeedMps();
    }
    if (spd == null || Number.isNaN(spd) || spd < 0) {
      return isMoving;
    }
    if (!isMoving) {
      if (spd >= MOTION_ENTER_MPS) {
        motionEnterStreak++;
        if (motionEnterStreak >= MOTION_CONFIRM_N) {
          isMoving = true;
          motionEnterStreak = 0;
          motionExitStreak = 0;
        }
      } else {
        motionEnterStreak = 0;
      }
    } else {
      if (spd < MOTION_EXIT_MPS) {
        motionExitStreak++;
        if (motionExitStreak >= MOTION_CONFIRM_N) {
          isMoving = false;
          motionExitStreak = 0;
          motionEnterStreak = 0;
          lastGpsCourseDeg = null;
        }
      } else {
        motionExitStreak = 0;
      }
    }
    return isMoving;
  }

  function resolveGpsCourse(coords) {
    var h = coords.heading;
    if (h != null && !Number.isNaN(h) && h >= 0) {
      lastGpsCourseDeg = normalizeDeg(h);
      return lastGpsCourseDeg;
    }
    var cog = courseFromHistory();
    if (cog != null) {
      lastGpsCourseDeg = cog;
      return cog;
    }
    return null;
  }

  /** Heading-up only: stationary → compass; moving → GPS course (fallback compass). */
  function onMotionHeadingTick(coords) {
    if (!followHeading) return;
    if (isMoving) {
      var course = resolveGpsCourse(coords);
      if (course != null) {
        headingSource = 'geo';
        applyMapBearing(course);
        return;
      }
      if (lastCompassHeading != null) {
        headingSource = 'device';
        applyMapBearing(lastCompassHeading);
      }
      return;
    }
    if (lastCompassHeading != null) {
      headingSource = 'device';
      applyMapBearing(lastCompassHeading);
    }
  }

  function deviceOrientationAngle() {
    if (typeof window.orientation === 'number') return window.orientation;
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return screen.orientation.angle;
    }
    return 0;
  }

  function withProgrammaticMove(fn) {
    applyingProgrammaticMove = true;
    try {
      fn();
    } finally {
      // dragstart can fire sync; clear on next frame
      requestAnimationFrame(function () {
        applyingProgrammaticMove = false;
      });
    }
  }

  function applyMapBearing(heading) {
    var h = normalizeDeg(heading);
    lastHeadingDeg = h;
    if (IS_IOS && IOS_BEARING_INVERT) {
      h = normalizeDeg(360 - h);
    }
    var now = Date.now();
    if (smoothedBearing == null) {
      smoothedBearing = h;
    } else {
      var delta = shortestAngleDelta(smoothedBearing, h);
      smoothedBearing = normalizeDeg(smoothedBearing + delta * 0.35);
    }
    if (now - lastBearingApplyAt < BEARING_THROTTLE_MS) return;
    lastBearingApplyAt = now;
    withProgrammaticMove(function () {
      map.setBearing(smoothedBearing);
    });
    btnNorth.disabled = false;
  }

  function geoErrorMessage(err) {
    if (!err) return '位置情報を取得できませんでした。';
    switch (err.code) {
      case 1:
        return '位置情報の許可が拒否されました。ブラウザのサイト設定で許可してください。';
      case 2:
        return '位置を特定できませんでした。屋外やGPSが使える場所で試してください。';
      case 3:
        return '位置情報の取得がタイムアウトしました。もう一度お試しください。';
      default:
        return '位置情報エラー: ' + (err.message || String(err.code || '不明'));
    }
  }

  function photoStyle() {
    return {
      version: 8,
      sources: {
        'gsi-seamlessphoto': {
          type: 'raster',
          tiles: [
            'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'
          ],
          tileSize: 256,
          attribution:
            '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
          maxzoom: 18
        }
      },
      layers: [
        {
          id: 'gsi-seamlessphoto',
          type: 'raster',
          source: 'gsi-seamlessphoto',
          minzoom: 0,
          maxzoom: 22
        }
      ]
    };
  }

  function fetchLibertyStyle() {
    if (libertyStyleCache) return Promise.resolve(libertyStyleCache);
    if (libertyStylePromise) return libertyStylePromise;
    libertyStylePromise = fetch(VECTOR_STYLE_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('liberty style HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) {
        libertyStyleCache = json;
        libertyStylePromise = null;
        return json;
      })
      .catch(function (err) {
        libertyStylePromise = null;
        throw err;
      });
    return libertyStylePromise;
  }

  function isRoadRelatedLineId(id) {
    var s = String(id || '').toLowerCase();
    return /road|highway|bridge|tunnel|path|railway|rail|motorway|street|service_track|link|transit/.test(s);
  }

  function isDarkColor(color) {
    if (typeof color !== 'string') return false;
    var c = color.trim().toLowerCase();
    var hex = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (hex) {
      var h = hex[1];
      var r, g, b;
      if (h.length === 3) {
        r = parseInt(h[0] + h[0], 16);
        g = parseInt(h[1] + h[1], 16);
        b = parseInt(h[2] + h[2], 16);
      } else {
        r = parseInt(h.slice(0, 2), 16);
        g = parseInt(h.slice(2, 4), 16);
        b = parseInt(h.slice(4, 6), 16);
      }
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.55;
    }
    var hsl = c.match(/^hsla?\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%/);
    if (hsl) return parseFloat(hsl[3]) < 55;
    return c === 'black' || c === 'gray' || c === 'grey' || c === 'dimgray' || c === 'dimgrey';
  }

  function strengthenSymbolForPhoto(layer) {
    var out = JSON.parse(JSON.stringify(layer));
    var layout = out.layout || {};
    if (layout['text-field'] == null) return out; // icon-only: leave alone
    var paint = out.paint = out.paint || {};
    if (isDarkColor(paint['text-color'])) {
      paint['text-color'] = '#ffffff';
      paint['text-halo-color'] = '#000000';
      var hw = paint['text-halo-width'];
      if (hw == null || (typeof hw === 'number' && hw < 1.2)) {
        paint['text-halo-width'] = 1.4;
      }
    }
    return out;
  }

  function buildPhotoHybridStyle() {
    return fetchLibertyStyle().then(function (liberty) {
      var sources = {};
      if (liberty.sources && liberty.sources.openmaptiles) {
        sources.openmaptiles = JSON.parse(JSON.stringify(liberty.sources.openmaptiles));
      }
      sources['gsi-seamlessphoto'] = {
        type: 'raster',
        tiles: [
          'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'
        ],
        tileSize: 256,
        attribution:
          '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
        maxzoom: 18
      };

      var roadLines = [];
      var building3d = null;
      var symbols = [];

      (liberty.layers || []).forEach(function (layer) {
        var t = layer.type;
        if (t === 'background' || t === 'fill' || t === 'raster') return;
        if (t === 'line') {
          if (isRoadRelatedLineId(layer.id)) {
            roadLines.push(JSON.parse(JSON.stringify(layer)));
          }
          return;
        }
        if (t === 'fill-extrusion' && layer.id === 'building-3d') {
          building3d = JSON.parse(JSON.stringify(layer));
          building3d.paint = building3d.paint || {};
          var op = building3d.paint['fill-extrusion-opacity'];
          if (op == null || (typeof op === 'number' && op < 0.6)) {
            building3d.paint['fill-extrusion-opacity'] = 0.7;
          }
          return;
        }
        if (t === 'symbol') {
          symbols.push(strengthenSymbolForPhoto(layer));
        }
      });

      var layers = [
        {
          id: 'gsi-seamlessphoto',
          type: 'raster',
          source: 'gsi-seamlessphoto',
          minzoom: 0,
          maxzoom: 22
        }
      ];
      layers = layers.concat(roadLines);
      if (building3d) layers.push(building3d);
      layers = layers.concat(symbols);

      return {
        version: 8,
        name: 'gsi-photo-hybrid',
        glyphs: liberty.glyphs,
        sprite: liberty.sprite,
        sources: sources,
        layers: layers
      };
    });
  }

  function gsiStdFallbackStyle() {
    return {
      version: 8,
      sources: {
        'gsi-std': {
          type: 'raster',
          tiles: [
            'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution:
            '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>（ベクトル不可時フォールバック）',
          maxzoom: 18
        }
      },
      layers: [
        {
          id: 'gsi-std',
          type: 'raster',
          source: 'gsi-std',
          minzoom: 0,
          maxzoom: 22
        }
      ]
    };
  }

  /** Point labels upright when map rotates; keep line labels map-aligned for roads. */
  function applyLabelUpright() {
    if (basemap === 'vector') {
      if (vectorStyleFailed) return;
    } else if (basemap === 'photo') {
      if (photoHybridFailed) return;
    } else {
      return;
    }
    var style = map.getStyle();
    if (!style || !style.layers) return;
    style.layers.forEach(function (layer) {
      if (layer.type !== 'symbol') return;
      var layout = layer.layout || {};
      var placement = layout['symbol-placement'] || 'point';
      if (placement === 'line' || placement === 'line-center') return;
      if (layout['text-field'] != null) {
        try {
          map.setLayoutProperty(layer.id, 'text-rotation-alignment', 'viewport');
          map.setLayoutProperty(layer.id, 'text-pitch-alignment', 'viewport');
        } catch (e) { /* ignore */ }
      }
      if (layout['icon-image'] != null) {
        try {
          map.setLayoutProperty(layer.id, 'icon-rotation-alignment', 'viewport');
          map.setLayoutProperty(layer.id, 'icon-pitch-alignment', 'viewport');
        } catch (e2) { /* ignore */ }
      }
    });
  }

  function updateHint() {
    if (basemap === 'photo') {
      if (photoHybridFailed) {
        hintEl.textContent =
          '航空写真（国土地理院 seamlessphoto）。地名ベクトルを読めなかったため写真のみ（文字は焼き込み・傾く場合あり）。標準に戻すと正立ラベル。ドラッグで追従解除→「現在地を表示」で復帰。';
      } else {
        hintEl.textContent =
          '航空写真: 国土地理院写真＋OpenFreeMap地名（向き合わせ時も正立）＋建物3D。立体ONでpitch連動。ドラッグで追従解除→「現在地を表示」で復帰。';
      }
    } else if (vectorStyleFailed) {
      hintEl.textContent =
        'ベクトル地図を読めなかったため国土地理院ラスタ標準にフォールバック中。ラベル正立は不可。屋外推奨・HTTPS必須。';
    } else {
      hintEl.textContent =
        '標準: OpenFreeMap Liberty（OSMベクトル）。向き合わせ時も地名・記号は画面に対して正立。向き合わせ時: 静止はコンパス、移動開始後はGPS進行方向を優先。ドラッグで追従解除→「現在地を表示」で復帰。コンパス／北上でノースアップ。航空は写真＋正立地名＋建物3D。iPhoneはコンパス許可後。';
    }
  }

  function preserveCamera() {
    return {
      center: map.getCenter(),
      zoom: map.getZoom(),
      bearing: map.getBearing(),
      pitch: map.getPitch()
    };
  }

  function restoreCamera(cam) {
    withProgrammaticMove(function () {
      map.jumpTo({
        center: cam.center,
        zoom: cam.zoom,
        bearing: cam.bearing,
        pitch: togglePitch.checked ? PITCH_ON : cam.pitch
      });
    });
  }

  function setBasemap(mode) {
    if (mode === basemap) return;
    var cam = preserveCamera();
    basemap = mode;
    btnBaseVector.classList.toggle('active', mode === 'vector');
    btnBasePhoto.classList.toggle('active', mode === 'photo');
    btnBaseVector.setAttribute('aria-pressed', mode === 'vector' ? 'true' : 'false');
    btnBasePhoto.setAttribute('aria-pressed', mode === 'photo' ? 'true' : 'false');

    function afterStyleLoad() {
      restoreCamera(cam);
      applyLabelUpright();
      updateHint();
      if (followLocation && lastPos) {
        withProgrammaticMove(function () {
          map.setCenter(lastPos);
        });
      }
    }

    if (mode === 'photo') {
      setStatus('航空写真ハイブリッド（地名・建物3D）を読込中…');
      updateHint();
      buildPhotoHybridStyle()
        .then(function (styleSpec) {
          if (basemap !== 'photo') return;
          photoHybridFailed = false;
          map.once('style.load', afterStyleLoad);
          withProgrammaticMove(function () {
            map.setStyle(styleSpec, { diff: false });
          });
          updateHint();
          if (lastPos) refreshLocationStatus('ok');
          else setStatus('航空写真ハイブリッドを表示中。', 'ok');
        })
        .catch(function () {
          if (basemap !== 'photo') return;
          photoHybridFailed = true;
          setStatus('航空写真の地名レイヤを読めませんでした。写真のみ表示します。', 'error');
          map.once('style.load', afterStyleLoad);
          withProgrammaticMove(function () {
            map.setStyle(photoStyle(), { diff: false });
          });
          updateHint();
        });
      return;
    }

    photoHybridFailed = false;
    var styleSpec = vectorStyleFailed ? gsiStdFallbackStyle() : VECTOR_STYLE_URL;

    map.once('style.load', afterStyleLoad);

    if (!vectorStyleFailed) {
      // Detect style fetch failure
      var failed = false;
      var onError = function (e) {
        if (failed) return;
        var err = e && e.error;
        var msg = (err && err.message) || String(e || '');
        // Only treat style JSON / tile source fatal as fallback trigger once
        if (/style|fetch|network|Failed to fetch|AJAXError/i.test(msg) || e.type === 'error') {
          // Don't flip on single tile miss; maplibre fires error for tiles too.
          // Use a timeout probe instead below.
        }
      };
      map.once('error', onError);
    }

    withProgrammaticMove(function () {
      map.setStyle(styleSpec, { diff: false });
    });
    updateHint();
  }

  var map = new maplibregl.Map({
    container: 'map',
    style: VECTOR_STYLE_URL,
    center: TOKYO,
    zoom: 15,
    bearing: 0,
    pitch: 0,
    attributionControl: true,
    hash: false,
    localIdeographFontFamily: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif'
  });

  var navControl = new maplibregl.NavigationControl({
    showCompass: true,
    visualizePitch: true,
    showZoom: true
  });
  map.addControl(navControl, 'top-right');
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');

  var markerEl = document.createElement('div');
  markerEl.setAttribute('aria-hidden', 'true');
  markerEl.style.cssText =
    'width:18px;height:18px;border-radius:50%;background:#1d9bf0;' +
    'border:3px solid #fff;box-shadow:0 0 0 2px rgba(29,155,240,0.45),0 1px 4px rgba(0,0,0,0.35);';

  var marker = new maplibregl.Marker({ element: markerEl, rotationAlignment: 'map', pitchAlignment: 'map' })
    .setLngLat(TOKYO)
    .addTo(map);

  function keepCenterOnUserAfterZoom() {
    if (!followLocation || !lastPos) return;
    withProgrammaticMove(function () {
      map.setCenter(lastPos);
    });
  }

  function wireNavControlExtras() {
    var root = map.getContainer();
    var compass = root.querySelector('.maplibregl-ctrl-compass');
    if (compass) {
      compass.title = '北上に戻す（向き合わせ解除）';
      compass.setAttribute('aria-label', '北上に戻す');
      compass.addEventListener('click', function () {
        // NavigationControl resets bearing; sync heading toggle
        followHeading = false;
        toggleHeading.checked = false;
        stopOrientation();
        headingSource = null;
        smoothedBearing = null;
        lastHeadingDeg = null;
        lastCompassHeading = null;
        lastGpsCourseDeg = null;
        btnNorth.disabled = true;
        setStatus('コンパスで北上に戻しました。' + (followLocation ? '・現在地を追従中' : '・地図操作中（現在地で復帰）'), 'ok');
      });
    }
    var zin = root.querySelector('.maplibregl-ctrl-zoom-in');
    var zout = root.querySelector('.maplibregl-ctrl-zoom-out');
    [zin, zout].forEach(function (btn) {
      if (!btn) return;
      btn.addEventListener('click', function () {
        // After control's zoom, keep user centered when following
        setTimeout(keepCenterOnUserAfterZoom, 0);
        setTimeout(keepCenterOnUserAfterZoom, 50);
      });
    });
  }

  function applyPosition(coords) {
    var lng = coords.longitude;
    var lat = coords.latitude;
    lastPos = [lng, lat];
    marker.setLngLat(lastPos);
    if (followLocation) {
      var opts = { center: lastPos, duration: 600 };
      if (!followHeading) opts.bearing = 0;
      withProgrammaticMove(function () {
        map.easeTo(opts);
      });
    }
    var acc = coords.accuracy != null ? Math.round(coords.accuracy) : null;
    var msg = followStatusBase();
    if (acc != null) msg += '（精度 約' + acc + ' m）';
    if (followHeading && headingSource) {
      msg += headingSourceLabel();
    }
    statusWithHeading(msg, followLocation ? 'ok' : '');
  }

  function onGeoSuccess(pos) {
    var coords = pos.coords;
    pushPosHistory(coords.longitude, coords.latitude, Date.now());
    updateMotionState(coords.speed);
    if (followHeading) {
      onMotionHeadingTick(coords);
    }
    applyPosition(coords);
  }

  function onGeoError(err) {
    setStatus(geoErrorMessage(err), 'error');
  }

  function startLocate() {
    if (!navigator.geolocation) {
      setStatus('このブラウザは Geolocation に対応していません。', 'error');
      return;
    }
    followLocation = true;
    setStatus('現在地を取得しています…');
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (lastPos) {
      withProgrammaticMove(function () {
        map.easeTo({ center: lastPos, duration: 400 });
      });
    }
    watchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 20000
    });
  }

  function stopOrientation() {
    if (orientHandler) {
      window.removeEventListener('deviceorientationabsolute', orientHandler);
      window.removeEventListener('deviceorientation', orientHandler);
      orientHandler = null;
    }
  }

  function compassHeadingFromEvent(e) {
    // iOS/iPadOS: always prefer webkitCompassHeading; ignore absolute/alpha
    var useWebkit = typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading);
    if (useWebkit || IS_IOS) {
      if (!useWebkit) return null;
      var h = e.webkitCompassHeading;
      h = normalizeDeg(h + deviceOrientationAngle());
      return h;
    }
    if (e.absolute === true && e.alpha != null && !Number.isNaN(e.alpha)) {
      return normalizeDeg(360 - e.alpha);
    }
    if (e.alpha != null && !Number.isNaN(e.alpha)) {
      return normalizeDeg(360 - e.alpha);
    }
    return null;
  }

  function startOrientation() {
    stopOrientation();
    headingSource = null;
    smoothedBearing = null;
    lastBearingApplyAt = 0;
    lastHeadingDeg = null;
    lastCompassHeading = null;
    lastGpsCourseDeg = null;
    var got = false;
    orientHandler = function (e) {
      var h = compassHeadingFromEvent(e);
      if (h == null) return;
      got = true;
      lastCompassHeading = h;
      if (!followHeading) return;
      // Moving with valid GPS course: do not let compass override
      if (isMoving && lastGpsCourseDeg != null) return;
      headingSource = 'device';
      applyMapBearing(h);
    };
    if (IS_IOS) {
      window.addEventListener('deviceorientation', orientHandler, true);
    } else {
      window.addEventListener('deviceorientationabsolute', orientHandler, true);
      window.addEventListener('deviceorientation', orientHandler, true);
    }

    var tryPerm = Promise.resolve();
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      tryPerm = DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state !== 'granted') {
          throw new Error('denied');
        }
      });
    }

    tryPerm.then(function () {
      setTimeout(function () {
        if (!got && followHeading) {
          setStatus('端末の向きが取れません。移動中なら GPS の進行方向を使います。取れない場合は北上のままです。', 'error');
        } else if (followHeading && got) {
          statusWithHeading(followStatusBase() + headingSourceLabel() + '・向き合わせ中', 'ok');
          btnNorth.disabled = false;
        }
      }, 2500);
    }).catch(function () {
      setStatus('向きセンサーの許可が得られませんでした。設定で許可するか、北上のままお使いください。', 'error');
      toggleHeading.checked = false;
      followHeading = false;
      stopOrientation();
    });
  }

  function resetNorth() {
    withProgrammaticMove(function () {
      map.easeTo({ bearing: 0, duration: 400 });
    });
    followHeading = false;
    toggleHeading.checked = false;
    stopOrientation();
    headingSource = null;
    smoothedBearing = null;
    lastHeadingDeg = null;
    lastCompassHeading = null;
    lastGpsCourseDeg = null;
    btnNorth.disabled = true;
    setStatus('北上（画面上＝北）に戻しました。・' + followStatusBase(), 'ok');
  }

  // User pan/drag → unfollow location (not programmatic)
  map.on('dragstart', function () {
    if (applyingProgrammaticMove) return;
    if (!followLocation) return;
    followLocation = false;
    refreshLocationStatus('');
  });

  btnLocate.addEventListener('click', function () {
    startLocate();
  });

  btnNorth.addEventListener('click', function () {
    resetNorth();
  });

  toggleHeading.addEventListener('change', function () {
    followHeading = toggleHeading.checked;
    if (followHeading) {
      btnNorth.disabled = false;
      startOrientation();
      setStatus('向き合わせモード（静止=コンパス／移動=GPS進行方向）。センサー待ち…・' + followStatusBase());
    } else {
      stopOrientation();
      headingSource = null;
      smoothedBearing = null;
      lastHeadingDeg = null;
      lastCompassHeading = null;
      lastGpsCourseDeg = null;
      withProgrammaticMove(function () {
        map.easeTo({ bearing: 0, duration: 400 });
      });
      btnNorth.disabled = true;
      setStatus('北上に戻しました。・' + followStatusBase(), 'ok');
    }
  });

  togglePitch.addEventListener('change', function () {
    var pitch = togglePitch.checked ? PITCH_ON : 0;
    withProgrammaticMove(function () {
      map.easeTo({ pitch: pitch, duration: 450 });
    });
    setStatus(
      (togglePitch.checked ? '立体表示 ON（pitch ' + PITCH_ON + '°）' : '立体表示 OFF') +
        '・' + followStatusBase(),
      'ok'
    );
  });

  btnBaseVector.addEventListener('click', function () {
    setBasemap('vector');
  });
  btnBasePhoto.addEventListener('click', function () {
    setBasemap('photo');
  });

  map.on('load', function () {
    applyLabelUpright();
    wireNavControlExtras();
    updateHint();
    startLocate();

    // If vector style never becomes usable, fall back after probe
    setTimeout(function () {
      if (basemap !== 'vector' || vectorStyleFailed) return;
      var layers = map.getStyle() && map.getStyle().layers;
      if (!layers || layers.length < 5) {
        vectorStyleFailed = true;
        setStatus('ベクトル地図の読込に失敗。国土地理院ラスタ標準に切り替えます（ラベル正立不可）。', 'error');
        updateHint();
        var cam = preserveCamera();
        map.once('style.load', function () {
          restoreCamera(cam);
          updateHint();
        });
        withProgrammaticMove(function () {
          map.setStyle(gsiStdFallbackStyle(), { diff: false });
        });
      }
    }, 8000);
  });

  map.on('style.load', function () {
    applyLabelUpright();
  });

  window.addEventListener('beforeunload', function () {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    stopOrientation();
  });
})();
  </script>
</body>
</html>
