<!DOCTYPE html>
<html lang="ja">
<head>

  <meta property="og:type" content="website">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2f3b4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --danger: #f4212e;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --border: #d0d7e2;
        --text: #0f1419;
        --muted: #5b6b82;
        --accent: #1a8cd8;
        --accent-hover: #1577b8;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }
    .topbar {
      flex: 0 0 auto;
      padding: 0.65rem 0.85rem calc(0.55rem + env(safe-area-inset-top, 0px));
      padding-top: max(0.65rem, env(safe-area-inset-top, 0px));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }
    .brand {
      margin: 0 0 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .brand a {
      color: var(--accent);
      text-decoration: none;
    }
    .brand a:hover { text-decoration: underline; }
    .topbar h1 {
      margin: 0 0 0.45rem;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 40px;
    }
    .btn:hover, .btn:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 40px;
    }
    .toggle input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
    .basemap-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-height: 40px;
    }
    .basemap-group button {
      appearance: none;
      border: 0;
      border-right: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      min-height: 38px;
    }
    .basemap-group button:last-child { border-right: 0; }
    .basemap-group button.active {
      background: var(--accent);
      color: #fff;
    }
    .basemap-group button:hover:not(.active),
    .basemap-group button:focus-visible:not(.active) {
      outline: none;
      background: color-mix(in srgb, var(--accent) 18%, var(--bg));
    }
    .status {
      margin: 0.45rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--accent); }
    #map {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      position: relative;
    }
    .maplibregl-ctrl-attrib {
      font-size: 10px !important;
    }
    .maplibregl-ctrl-compass {
      cursor: pointer;
    }
    .hint-bar {
      flex: 0 0 auto;
      padding: 0.4rem 0.85rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <p class="brand"><a href="/">← tools.kyg-style.com</a></p>
      <h1>駐車場ナビ試し（現在地）</h1>
      <div class="controls">
        <button type="button" id="btn-locate" class="btn primary">現在地を表示</button>
        <label class="toggle" for="toggle-heading">
          <input type="checkbox" id="toggle-heading">
          向きを合わせる
        </label>
        <button type="button" id="btn-north" class="btn" disabled>北上に戻す</button>
        <label class="toggle" for="toggle-pitch">
          <input type="checkbox" id="toggle-pitch">
          立体
        </label>
        <div class="basemap-group" role="group" aria-label="ベースマップ">
          <button type="button" id="btn-base-vector" class="active" aria-pressed="true">標準</button>
          <button type="button" id="btn-base-photo" aria-pressed="false">航空写真</button>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">位置情報は端末内だけで使い、サーバには送りません。</p>
    </header>
    <div id="map" role="application" aria-label="地図"></div>
    <p class="hint-bar" id="hint-bar">屋外推奨・HTTPS必須。標準はベクトル地図（向き合わせ時も地名が正立）。ドラッグで追従解除→「現在地を表示」で復帰。コンパス／北上でノースアップ。航空写真はラスタのため文字は傾きます。iPhoneはコンパス許可後。</p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
(function () {
  'use strict';

  var TOKYO = [139.7671, 35.6812];
  var VECTOR_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
  var PITCH_ON = 60;

  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint-bar');
  var btnLocate = document.getElementById('btn-locate');
  var btnNorth = document.getElementById('btn-north');
  var toggleHeading = document.getElementById('toggle-heading');
  var togglePitch = document.getElementById('toggle-pitch');
  var btnBaseVector = document.getElementById('btn-base-vector');
  var btnBasePhoto = document.getElementById('btn-base-photo');

  var watchId = null;
  var orientHandler = null;
  var lastPos = null;
  var followHeading = false;
  var followLocation = true;
  var basemap = 'vector'; // 'vector' | 'photo'
  var vectorStyleFailed = false;
  var headingSource = null; // 'device' | 'geo' | null
  var lastHeadingDeg = null;
  var smoothedBearing = null;
  var lastBearingApplyAt = 0;
  var BEARING_THROTTLE_MS = 120;
  // iOS: MapLibre が CCW で食い違う場合は true にすると mapBearing = (360 - h) % 360
  var IOS_BEARING_INVERT = false;
  var applyingProgrammaticMove = false;

  var IS_IOS = (function () {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
    return false;
  })();

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function statusWithHeading(base, kind) {
    var msg = base;
    if (lastHeadingDeg != null && !Number.isNaN(lastHeadingDeg)) {
      msg += '・向き ' + Math.round(lastHeadingDeg) + '°';
    }
    setStatus(msg, kind);
  }

  function followStatusBase() {
    if (followLocation) return '現在地を追従中';
    return '地図操作中（現在地で復帰）';
  }

  function refreshLocationStatus(kind) {
    var msg = followStatusBase();
    if (lastPos) {
      msg += '・表示中';
    }
    if (followHeading && headingSource) {
      msg += headingSource === 'device' ? '・端末の向きで回転中' : '・移動方向で回転中';
    }
    statusWithHeading(msg, kind || (followLocation ? 'ok' : ''));
  }

  function shortestAngleDelta(from, to) {
    return ((to - from + 540) % 360) - 180;
  }

  function normalizeDeg(d) {
    return ((d % 360) + 360) % 360;
  }

  function deviceOrientationAngle() {
    if (typeof window.orientation === 'number') return window.orientation;
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return screen.orientation.angle;
    }
    return 0;
  }

  function withProgrammaticMove(fn) {
    applyingProgrammaticMove = true;
    try {
      fn();
    } finally {
      // dragstart can fire sync; clear on next frame
      requestAnimationFrame(function () {
        applyingProgrammaticMove = false;
      });
    }
  }

  function applyMapBearing(heading) {
    var h = normalizeDeg(heading);
    lastHeadingDeg = h;
    if (IS_IOS && IOS_BEARING_INVERT) {
      h = normalizeDeg(360 - h);
    }
    var now = Date.now();
    if (smoothedBearing == null) {
      smoothedBearing = h;
    } else {
      var delta = shortestAngleDelta(smoothedBearing, h);
      smoothedBearing = normalizeDeg(smoothedBearing + delta * 0.35);
    }
    if (now - lastBearingApplyAt < BEARING_THROTTLE_MS) return;
    lastBearingApplyAt = now;
    withProgrammaticMove(function () {
      map.setBearing(smoothedBearing);
    });
    btnNorth.disabled = false;
  }

  function geoErrorMessage(err) {
    if (!err) return '位置情報を取得できませんでした。';
    switch (err.code) {
      case 1:
        return '位置情報の許可が拒否されました。ブラウザのサイト設定で許可してください。';
      case 2:
        return '位置を特定できませんでした。屋外やGPSが使える場所で試してください。';
      case 3:
        return '位置情報の取得がタイムアウトしました。もう一度お試しください。';
      default:
        return '位置情報エラー: ' + (err.message || String(err.code || '不明'));
    }
  }

  function photoStyle() {
    return {
      version: 8,
      sources: {
        'gsi-seamlessphoto': {
          type: 'raster',
          tiles: [
            'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'
          ],
          tileSize: 256,
          attribution:
            '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
          maxzoom: 18
        }
      },
      layers: [
        {
          id: 'gsi-seamlessphoto',
          type: 'raster',
          source: 'gsi-seamlessphoto',
          minzoom: 0,
          maxzoom: 22
        }
      ]
    };
  }

  function gsiStdFallbackStyle() {
    return {
      version: 8,
      sources: {
        'gsi-std': {
          type: 'raster',
          tiles: [
            'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          attribution:
            '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>（ベクトル不可時フォールバック）',
          maxzoom: 18
        }
      },
      layers: [
        {
          id: 'gsi-std',
          type: 'raster',
          source: 'gsi-std',
          minzoom: 0,
          maxzoom: 22
        }
      ]
    };
  }

  /** Point labels upright when map rotates; keep line labels map-aligned for roads. */
  function applyLabelUpright() {
    if (basemap !== 'vector' || vectorStyleFailed) return;
    var style = map.getStyle();
    if (!style || !style.layers) return;
    style.layers.forEach(function (layer) {
      if (layer.type !== 'symbol') return;
      var layout = layer.layout || {};
      var placement = layout['symbol-placement'] || 'point';
      if (placement === 'line' || placement === 'line-center') return;
      if (layout['text-field'] != null) {
        try {
          map.setLayoutProperty(layer.id, 'text-rotation-alignment', 'viewport');
          map.setLayoutProperty(layer.id, 'text-pitch-alignment', 'viewport');
        } catch (e) { /* ignore */ }
      }
      if (layout['icon-image'] != null) {
        try {
          map.setLayoutProperty(layer.id, 'icon-rotation-alignment', 'viewport');
          map.setLayoutProperty(layer.id, 'icon-pitch-alignment', 'viewport');
        } catch (e2) { /* ignore */ }
      }
    });
  }

  function updateHint() {
    if (basemap === 'photo') {
      hintEl.textContent =
        '航空写真（国土地理院 seamlessphoto・ラスタ）。焼き込み文字は地図回転で傾きます。標準（ベクトル）に戻すと地名が正立します。ドラッグで追従解除→「現在地を表示」で復帰。';
    } else if (vectorStyleFailed) {
      hintEl.textContent =
        'ベクトル地図を読めなかったため国土地理院ラスタ標準にフォールバック中。ラベル正立は不可。屋外推奨・HTTPS必須。';
    } else {
      hintEl.textContent =
        '標準: OpenFreeMap Liberty（OSMベクトル）。向き合わせ時も地名・記号は画面に対して正立。ドラッグで追従解除→「現在地を表示」で復帰。コンパス／北上でノースアップ。航空はラスタ。iPhoneはコンパス許可後。';
    }
  }

  function preserveCamera() {
    return {
      center: map.getCenter(),
      zoom: map.getZoom(),
      bearing: map.getBearing(),
      pitch: map.getPitch()
    };
  }

  function restoreCamera(cam) {
    withProgrammaticMove(function () {
      map.jumpTo({
        center: cam.center,
        zoom: cam.zoom,
        bearing: cam.bearing,
        pitch: togglePitch.checked ? PITCH_ON : cam.pitch
      });
    });
  }

  function setBasemap(mode) {
    if (mode === basemap) return;
    var cam = preserveCamera();
    basemap = mode;
    btnBaseVector.classList.toggle('active', mode === 'vector');
    btnBasePhoto.classList.toggle('active', mode === 'photo');
    btnBaseVector.setAttribute('aria-pressed', mode === 'vector' ? 'true' : 'false');
    btnBasePhoto.setAttribute('aria-pressed', mode === 'photo' ? 'true' : 'false');

    var styleSpec = mode === 'photo'
      ? photoStyle()
      : (vectorStyleFailed ? gsiStdFallbackStyle() : VECTOR_STYLE_URL);

    map.once('style.load', function () {
      restoreCamera(cam);
      if (mode === 'vector' && !vectorStyleFailed) {
        applyLabelUpright();
      }
      updateHint();
      if (followLocation && lastPos) {
        withProgrammaticMove(function () {
          map.setCenter(lastPos);
        });
      }
    });

    if (mode === 'vector' && !vectorStyleFailed) {
      // Detect style fetch failure
      var failed = false;
      var onError = function (e) {
        if (failed) return;
        var err = e && e.error;
        var msg = (err && err.message) || String(e || '');
        // Only treat style JSON / tile source fatal as fallback trigger once
        if (/style|fetch|network|Failed to fetch|AJAXError/i.test(msg) || e.type === 'error') {
          // Don't flip on single tile miss; maplibre fires error for tiles too.
          // Use a timeout probe instead below.
        }
      };
      map.once('error', onError);
    }

    withProgrammaticMove(function () {
      map.setStyle(styleSpec, { diff: false });
    });
    updateHint();
  }

  var map = new maplibregl.Map({
    container: 'map',
    style: VECTOR_STYLE_URL,
    center: TOKYO,
    zoom: 15,
    bearing: 0,
    pitch: 0,
    attributionControl: true,
    hash: false,
    localIdeographFontFamily: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif'
  });

  var navControl = new maplibregl.NavigationControl({
    showCompass: true,
    visualizePitch: true,
    showZoom: true
  });
  map.addControl(navControl, 'top-right');
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');

  var markerEl = document.createElement('div');
  markerEl.setAttribute('aria-hidden', 'true');
  markerEl.style.cssText =
    'width:18px;height:18px;border-radius:50%;background:#1d9bf0;' +
    'border:3px solid #fff;box-shadow:0 0 0 2px rgba(29,155,240,0.45),0 1px 4px rgba(0,0,0,0.35);';

  var marker = new maplibregl.Marker({ element: markerEl, rotationAlignment: 'map', pitchAlignment: 'map' })
    .setLngLat(TOKYO)
    .addTo(map);

  function keepCenterOnUserAfterZoom() {
    if (!followLocation || !lastPos) return;
    withProgrammaticMove(function () {
      map.setCenter(lastPos);
    });
  }

  function wireNavControlExtras() {
    var root = map.getContainer();
    var compass = root.querySelector('.maplibregl-ctrl-compass');
    if (compass) {
      compass.title = '北上に戻す（向き合わせ解除）';
      compass.setAttribute('aria-label', '北上に戻す');
      compass.addEventListener('click', function () {
        // NavigationControl resets bearing; sync heading toggle
        followHeading = false;
        toggleHeading.checked = false;
        stopOrientation();
        headingSource = null;
        smoothedBearing = null;
        lastHeadingDeg = null;
        btnNorth.disabled = true;
        setStatus('コンパスで北上に戻しました。' + (followLocation ? '・現在地を追従中' : '・地図操作中（現在地で復帰）'), 'ok');
      });
    }
    var zin = root.querySelector('.maplibregl-ctrl-zoom-in');
    var zout = root.querySelector('.maplibregl-ctrl-zoom-out');
    [zin, zout].forEach(function (btn) {
      if (!btn) return;
      btn.addEventListener('click', function () {
        // After control's zoom, keep user centered when following
        setTimeout(keepCenterOnUserAfterZoom, 0);
        setTimeout(keepCenterOnUserAfterZoom, 50);
      });
    });
  }

  function applyPosition(coords) {
    var lng = coords.longitude;
    var lat = coords.latitude;
    lastPos = [lng, lat];
    marker.setLngLat(lastPos);
    if (followLocation) {
      var opts = { center: lastPos, duration: 600 };
      if (!followHeading) opts.bearing = 0;
      withProgrammaticMove(function () {
        map.easeTo(opts);
      });
    }
    var acc = coords.accuracy != null ? Math.round(coords.accuracy) : null;
    var msg = followStatusBase();
    if (acc != null) msg += '（精度 約' + acc + ' m）';
    if (followHeading && headingSource) {
      msg += headingSource === 'device' ? '・端末の向きで回転中' : '・移動方向で回転中';
    }
    statusWithHeading(msg, followLocation ? 'ok' : '');
  }

  function onGeoSuccess(pos) {
    applyPosition(pos.coords);
    if (followHeading && pos.coords.heading != null && !Number.isNaN(pos.coords.heading) && pos.coords.heading >= 0) {
      if (headingSource !== 'device') {
        headingSource = 'geo';
        applyMapBearing(pos.coords.heading);
      }
    }
  }

  function onGeoError(err) {
    setStatus(geoErrorMessage(err), 'error');
  }

  function startLocate() {
    if (!navigator.geolocation) {
      setStatus('このブラウザは Geolocation に対応していません。', 'error');
      return;
    }
    followLocation = true;
    setStatus('現在地を取得しています…');
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (lastPos) {
      withProgrammaticMove(function () {
        map.easeTo({ center: lastPos, duration: 400 });
      });
    }
    watchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 20000
    });
  }

  function stopOrientation() {
    if (orientHandler) {
      window.removeEventListener('deviceorientationabsolute', orientHandler);
      window.removeEventListener('deviceorientation', orientHandler);
      orientHandler = null;
    }
  }

  function compassHeadingFromEvent(e) {
    // iOS/iPadOS: always prefer webkitCompassHeading; ignore absolute/alpha
    var useWebkit = typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading);
    if (useWebkit || IS_IOS) {
      if (!useWebkit) return null;
      var h = e.webkitCompassHeading;
      h = normalizeDeg(h + deviceOrientationAngle());
      return h;
    }
    if (e.absolute === true && e.alpha != null && !Number.isNaN(e.alpha)) {
      return normalizeDeg(360 - e.alpha);
    }
    if (e.alpha != null && !Number.isNaN(e.alpha)) {
      return normalizeDeg(360 - e.alpha);
    }
    return null;
  }

  function startOrientation() {
    stopOrientation();
    headingSource = null;
    smoothedBearing = null;
    lastBearingApplyAt = 0;
    lastHeadingDeg = null;
    var got = false;
    orientHandler = function (e) {
      var h = compassHeadingFromEvent(e);
      if (h == null) return;
      got = true;
      headingSource = 'device';
      if (followHeading) {
        applyMapBearing(h);
      }
    };
    if (IS_IOS) {
      window.addEventListener('deviceorientation', orientHandler, true);
    } else {
      window.addEventListener('deviceorientationabsolute', orientHandler, true);
      window.addEventListener('deviceorientation', orientHandler, true);
    }

    var tryPerm = Promise.resolve();
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      tryPerm = DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state !== 'granted') {
          throw new Error('denied');
        }
      });
    }

    tryPerm.then(function () {
      setTimeout(function () {
        if (!got && followHeading) {
          setStatus('端末の向きが取れません。移動中なら GPS の進行方向を使います。取れない場合は北上のままです。', 'error');
        } else if (followHeading && got) {
          statusWithHeading(followStatusBase() + '・向きに合わせて回転中', 'ok');
          btnNorth.disabled = false;
        }
      }, 2500);
    }).catch(function () {
      setStatus('向きセンサーの許可が得られませんでした。設定で許可するか、北上のままお使いください。', 'error');
      toggleHeading.checked = false;
      followHeading = false;
      stopOrientation();
    });
  }

  function resetNorth() {
    withProgrammaticMove(function () {
      map.easeTo({ bearing: 0, duration: 400 });
    });
    followHeading = false;
    toggleHeading.checked = false;
    stopOrientation();
    headingSource = null;
    smoothedBearing = null;
    lastHeadingDeg = null;
    btnNorth.disabled = true;
    setStatus('北上（画面上＝北）に戻しました。・' + followStatusBase(), 'ok');
  }

  // User pan/drag → unfollow location (not programmatic)
  map.on('dragstart', function () {
    if (applyingProgrammaticMove) return;
    if (!followLocation) return;
    followLocation = false;
    refreshLocationStatus('');
  });

  btnLocate.addEventListener('click', function () {
    startLocate();
  });

  btnNorth.addEventListener('click', function () {
    resetNorth();
  });

  toggleHeading.addEventListener('change', function () {
    followHeading = toggleHeading.checked;
    if (followHeading) {
      btnNorth.disabled = false;
      startOrientation();
      setStatus('向きを合わせるモードです。センサーまたは移動方向を待ちます…・' + followStatusBase());
    } else {
      stopOrientation();
      headingSource = null;
      smoothedBearing = null;
      lastHeadingDeg = null;
      withProgrammaticMove(function () {
        map.easeTo({ bearing: 0, duration: 400 });
      });
      btnNorth.disabled = true;
      setStatus('北上に戻しました。・' + followStatusBase(), 'ok');
    }
  });

  togglePitch.addEventListener('change', function () {
    var pitch = togglePitch.checked ? PITCH_ON : 0;
    withProgrammaticMove(function () {
      map.easeTo({ pitch: pitch, duration: 450 });
    });
    setStatus(
      (togglePitch.checked ? '立体表示 ON（pitch ' + PITCH_ON + '°）' : '立体表示 OFF') +
        '・' + followStatusBase(),
      'ok'
    );
  });

  btnBaseVector.addEventListener('click', function () {
    setBasemap('vector');
  });
  btnBasePhoto.addEventListener('click', function () {
    setBasemap('photo');
  });

  map.on('load', function () {
    applyLabelUpright();
    wireNavControlExtras();
    updateHint();
    startLocate();

    // If vector style never becomes usable, fall back after probe
    setTimeout(function () {
      if (basemap !== 'vector' || vectorStyleFailed) return;
      var layers = map.getStyle() && map.getStyle().layers;
      if (!layers || layers.length < 5) {
        vectorStyleFailed = true;
        setStatus('ベクトル地図の読込に失敗。国土地理院ラスタ標準に切り替えます（ラベル正立不可）。', 'error');
        updateHint();
        var cam = preserveCamera();
        map.once('style.load', function () {
          restoreCamera(cam);
          updateHint();
        });
        withProgrammaticMove(function () {
          map.setStyle(gsiStdFallbackStyle(), { diff: false });
        });
      }
    }, 8000);
  });

  map.on('style.load', function () {
    if (basemap === 'vector' && !vectorStyleFailed) {
      applyLabelUpright();
    }
  });

  window.addEventListener('beforeunload', function () {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    stopOrientation();
  });
})();
  </script>
</body>
</html>
